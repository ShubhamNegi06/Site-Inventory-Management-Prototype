[project]
name = "inventory-backend"
version = "0.1.0"
description = "Sample Inventory API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<0.35",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "psycopg2-binary>=2.9,<3.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "email-validator>=2.2,<3.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "python-multipart>=0.0.9,<0.1",
    "boto3>=1.35,<2.0",
    "python-dotenv>=1.0,<2.0",
    "supabase>=2.7,<3.0",
    "openpyxl>=3.1,<4.0",
]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "off"
